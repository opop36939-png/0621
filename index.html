<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자격증 합격률 조회</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>📊 자격증 합격률 조회</h1>

        <p class="subtitle">
            원하는 자격증의 합격률을 조회해보세요.
        </p>

        <div class="search-box">

            <input
                type="text"
                placeholder="자격증 이름 입력">

            <button id="searchBtn">
                검색
            </button>

        </div>

        <div class="result">

            아직 조회된 데이터가 없습니다.

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
